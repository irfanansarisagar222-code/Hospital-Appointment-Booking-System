<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - OTP Verification</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="navbar">
        <h1 style="color: white; font-size: 1.5rem; margin: 0; font-weight: bold; display: flex; align-items: center;">
    <span style="background-color: white; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0;">
        <span style="color: #38bdf8; font-size: 28px; font-weight: bold; line-height: 1; margin-top: -2px;">+</span>
    </span>
            Smart Healthcare Appointment & Patient System
        </h1>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/auth/login">Login</a>
        </nav>
    </div>
</header>

<main>
    <div class="card" style="max-width: 400px; margin: 40px auto;">
        <h2>Sign Up</h2>
        <p>Enter your email to receive an OTP.</p>
        <br>
        <form action="/auth/send-otp" method="POST">
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="Enter Email" required>
            <br><br>
            <button type="submit" class="btn-primary" style="width: 100%;">Send OTP</button>
        </form>
    </div>
</main>

<footer class="simple-footer">
    <p>&copy; 2026 Smart Healthcare Appointment & Patient System</p>
</footer>

</body>
</html>
