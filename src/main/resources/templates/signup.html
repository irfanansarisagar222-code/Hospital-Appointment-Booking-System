<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - OTP Verification</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="navbar">
        <h1 style="color: white; font-size: 1.4rem;">Hospital Appointment System</h1>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/auth/login">Login</a>
        </nav>
    </div>
</header>

<main>
    <div class="card" style="max-width: 400px; margin: 40px auto;">
        <h2>Sign Up</h2>
        <p>Enter your email to receive an OTP.</p>
        <br>
        <form action="/auth/send-otp" method="POST">
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="Enter Email" required>
            <br><br>
            <button type="submit" class="btn-primary" style="width: 100%;">Send OTP</button>
        </form>
    </div>
</main>

<footer class="simple-footer">
    <p>&copy; 2026 Hospital Appointment System</p>
</footer>

</body>
</html>
