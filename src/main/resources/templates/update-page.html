<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Patient Data</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<header>
    <div class="navbar" style="background-color: #87ceeb; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="color: white; font-size: 1.5rem; margin: 0; font-weight: bold; display: flex; align-items: center;">
    <span style="background-color: white; border-radius: 50%; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0;">
        <span style="color: #38bdf8; font-size: 28px; font-weight: bold; line-height: 1; margin-top: -2px;">+</span>
    </span>
            Smart Healthcare Appointment & Patient <System></System>
        </h1>
        <nav class="nav-links">
            <a href="/user/dashboard" class="nav-back-btn">&larr; Back to Dashboard</a>
        </nav>
    </div>
</header>


<main class="form-wrapper">


    <div class="common-form grid-form">
        <h2>Edit Profile</h2>
        <form th:action="@{/user/update-patient}" method="get">
            <div class="form-group">
                <label>Select ID to Edit:</label>
                <select name="id" onchange="this.form.submit()">
                    <option value="">--- Choose ID ---</option>
                    <option th:each="p : ${allPatients}"
                            th:value="${p.id}"
                            th:text="${p.id + ' - ' + p.name}"
                            th:selected="${patient != null and patient.id == p.id}"></option>
                </select>
            </div>
        </form>

        <hr style="...">

        <div th:if="${patient != null}">
            <!-- फॉर्म में id="updateForm" जोड़ा गया है -->
            <form id="updateForm" th:action="@{/user/update-patient/{id}(id=${patient.id})}" th:object="${patient}" method="post">
                <p>Editing Profile for ID: <b><span th:text="${patient.id}"></span></b></p>

                <div class="form-row">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" th:field="*{name}" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" th:field="*{email}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone:</label>
                        <input type="tel" th:field="*{phoneNumber}" required>
                    </div>
                    <div class="form-group">
                        <label>Age:</label>
                        <input type="number" th:field="*{age}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender:</label>
                        <select th:field="*{gender}">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <button type="submit" style="...">Update All Details</button>
            </form>
        </div>
    </div>
</main>

<script>
    document.getElementById('updateForm').addEventListener('submit', function(event) {
        event.preventDefault(); // नॉर्मल फॉर्म सबमिशन रोकें

        Swal.fire({
            title: 'Are you sure?',
            text: "You want to update these details?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, update it!',
            customClass: { popup: 'my-custom-popup' },
            buttonsStyling: true
        }).then((result) => {
            if (result.isConfirmed) {
                // फॉर्म का डेटा लें
                let formData = new FormData(event.target);
                let actionUrl = event.target.action;

                // AJAX के ज़रिए डेटा सबमिट करें
                fetch(actionUrl, {
                    method: 'POST',
                    body: formData
                }).then(response => {
                    if (response.ok) {
                        // सक्सेस होने पर डैशबोर्ड पर रीडायरेक्ट कर दें
                        window.location.href = '/user/dashboard';
                    } else {
                        alert('Something went wrong!');
                    }
                }).catch(error => {
                    console.error('Error:', error);
                });
            }
        });
    });
</script>
<footer style="text-align: center; padding: 15px; background-color: #87ceeb; margin-top: 30px;">
    <p style="margin: 0; color: #fff; font-weight: 500;">&copy; 2026 Smart Healthcare Appointment & Patient System. All Rights Reserved.</p>
</footer>

</body>
</html>
