<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">

    <style>
        .page-wrapper {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .table-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
        }

        .table-card-header {
            margin-bottom: 25px;
        }

        .table-card-header h2 {
            color: #0077b6;
            font-weight: 800;
            margin: 0;
            font-size: 1.8rem;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.92rem;
        }

        .custom-table thead {
            background-color: #0077b6;
            color: white;
        }

        .custom-table th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #0077b6;
            white-space: nowrap;
        }

        .custom-table td {
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            color: #444;
            vertical-align: middle;
        }

        .custom-table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .custom-table tbody tr:hover {
            background-color: #eef6ff;
        }

        /* Status Select Styling */
        .status-select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #f8f9fa;
            outline: none;
            cursor: pointer;
        }

        .status-select:focus {
            border-color: #0077b6;
        }

        /* Action PDF Button Styling */
        .btn-download {
            background-color: #0077b6 !important;
            color: white !important;
            border: none !important;
            padding: 6px 14px !important;
            border-radius: 6px !important;
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            text-decoration: none !important;
            display: inline-block;
            transition: all 0.3s ease !important;
        }

        .btn-download:hover {
            background-color: #0056b3 !important;
            box-shadow: 0 2px 6px rgba(0, 119, 182, 0.3);
        }

        /* Header Back Button Styling */
        .nav-back-btn {
            background: transparent !important;
            color: white !important;
            border: 1.5px solid white !important;
            padding: 6px 14px !important;
            border-radius: 6px !important;
            text-decoration: none !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            transition: all 0.3s ease !important;
        }

        .nav-back-btn:hover {
            background: white !important;
            color: #0077b6 !important;
        }
    </style>
</head>
<body>

<header>
    <div class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 30px;">
        <h1 style="color: white; font-size: 1.4rem; margin: 0;">Hospital Appointment System</h1>
        <nav class="nav-links">
            <a href="/admin/dashboard" class="nav-back-btn">&larr; Back to Dashboard</a>
        </nav>
    </div>
</header>

<main class="page-wrapper">
    <div class="table-card">
        <div class="table-card-header">
            <h2>Appointment List</h2>
        </div>

        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Status</th>
                    <th>Change Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}" th:if="${appointments != null && !#lists.isEmpty(appointments)}">
                    <td th:text="${appt.id}" style="font-weight: 600; color: #0077b6;"></td>
                    <td th:text="${appt.patient != null ? appt.patient.name : 'N/A'}" style="font-weight: 600;"></td>
                    <td th:text="${appt.doctor != null ? appt.doctor.name : 'N/A'}"></td>
                    <td>
                        <!-- Completed aur Confirmed dono ke liye green badge -->
                        <span th:text="${appt.status}"
                              th:classappend="${appt.status == 'Confirmed' || appt.status == 'Completed' ? 'badge bg-success' : (appt.status == 'Cancelled' ? 'badge bg-danger' : 'badge bg-warning text-dark')}"
                              style="font-size: 0.8rem; padding: 6px 10px;">
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/admin/appointments/update-status/{id}(id=${appt.id})}" method="POST" style="margin:0;">
                            <select name="status" class="status-select" onchange="this.form.submit()">
                                <option value="Pending" th:selected="${appt.status == 'Pending'}">Pending</option>
                                <option value="Confirmed" th:selected="${appt.status == 'Confirmed'}">Confirmed</option>
                                <option value="Cancelled" th:selected="${appt.status == 'Cancelled'}">Cancelled</option>
                                <option value="Completed" th:selected="${appt.status == 'Completed'}">Completed</option>
                            </select>
                        </form>
                    </td>
                    <td>
                        <a th:href="@{'/admin/download-receipt/' + ${appt.id}}" class="btn-download">
                            📄 Download PDF
                        </a>
                    </td>
                </tr>
                <tr th:if="${appointments == null || #lists.isEmpty(appointments)}">
                    <td colspan="6" style="text-align: center; color: #888; padding: 20px;">No appointments found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Hospital Appointment System. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
